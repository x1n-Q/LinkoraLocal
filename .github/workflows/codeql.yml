name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "17 3 * * 2"

permissions:
  security-events: write
  packages: read
  contents: read

jobs:
  analyze:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
      - run: dotnet build src/Linkora.Local/Linkora.Local.csproj -c Release
      - uses: github/codeql-action/analyze@v3
